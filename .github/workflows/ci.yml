name: Editor CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      source_repository:
        description: Repository that triggered this CI.
        required: false
      source_sha:
        description: Commit SHA that triggered this CI.
        required: false
      source_run_id:
        description: GitHub Actions run ID that triggered this CI.
        required: false
      source_run_url:
        description: GitHub Actions run URL that triggered this CI.
        required: false

permissions:
  contents: read

concurrency:
  group: editor-latexdo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: typecheck / build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type checks
        run: npm run typecheck

      - name: Build
        run: npm run build
